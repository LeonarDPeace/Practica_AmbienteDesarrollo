<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="Diagrama de red — Parcial 1 Servicios Telemáticos">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0f1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1d27;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0d6efd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0856c8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="slaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#198754;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f5c38;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#6f42c1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a2d8a;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6ee7b7"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Título -->
  <text x="400" y="45" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="20" font-weight="800" fill="#e2e8f0" filter="url(#glow)">
    Parcial 1 — Servicios Telemáticos 2026-02
  </text>
  <text x="400" y="70" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="13" fill="#94a3b8">
    Topología de Red · BIND9 Maestro/Esclavo + Apache2 + cloudflared
  </text>

  <!-- ── VM Maestro ─────────────────────────────────────────────────────── -->
  <rect x="60" y="130" width="280" height="240" rx="14"
        fill="url(#masterGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  <text x="200" y="160" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="15" font-weight="700" fill="#fff">parcial_master</text>
  <text x="200" y="180" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#bfdbfe">192.168.50.10</text>
  <line x1="80" y1="192" x2="320" y2="192" stroke="#bfdbfe" stroke-width="0.5" opacity="0.5"/>

  <!-- Servicios del maestro -->
  <rect x="80" y="202" width="240" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="200" y="224" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#a5f3fc">🔵 BIND9 — DNS Maestro (53/TCP/UDP)</text>

  <rect x="80" y="246" width="240" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="200" y="268" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#a5f3fc">🌐 Apache2 (80/TCP)</text>

  <rect x="80" y="290" width="240" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="200" y="312" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#a5f3fc">☁️  cloudflared (→ 80)</text>

  <rect x="80" y="334" width="240" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="200" y="350" text-anchor="middle" font-family="monospace"
        font-size="11" fill="#93c5fd">mod_deflate · mod_brotli</text>

  <!-- ── VM Esclavo ─────────────────────────────────────────────────────── -->
  <rect x="460" y="130" width="280" height="160" rx="14"
        fill="url(#slaveGrad)" stroke="#6ee7b7" stroke-width="1.5" opacity="0.9"/>
  <text x="600" y="160" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="15" font-weight="700" fill="#fff">parcial_slave</text>
  <text x="600" y="180" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#bbf7d0">192.168.50.11</text>
  <line x1="480" y1="192" x2="720" y2="192" stroke="#bbf7d0" stroke-width="0.5" opacity="0.5"/>

  <rect x="480" y="202" width="240" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="600" y="224" text-anchor="middle" font-family="monospace"
        font-size="12" fill="#6ee7b7">🟢 BIND9 — DNS Esclavo (53/TCP/UDP)</text>

  <rect x="480" y="246" width="240" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="600" y="264" text-anchor="middle" font-family="monospace"
        font-size="11" fill="#a7f3d0">AXFR/IXFR ← maestro (TSIG)</text>

  <!-- ── Nube Cloudflare ───────────────────────────────────────────────── -->
  <rect x="290" y="490" width="220" height="80" rx="14"
        fill="url(#cloudGrad)" stroke="#c4b5fd" stroke-width="1.5" opacity="0.9"/>
  <text x="400" y="520" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="14" font-weight="700" fill="#fff">☁️ Cloudflare Edge</text>
  <text x="400" y="540" text-anchor="middle" font-family="monospace"
        font-size="11" fill="#ddd6fe">trycloudflare.com</text>
  <text x="400" y="558" text-anchor="middle" font-family="monospace"
        font-size="10" fill="#c4b5fd">TLS 1.3 · HTTP/2</text>

  <!-- ── Flechas de conexión ────────────────────────────────────────────── -->
  <!-- Maestro → Esclavo: TSIG AXFR/IXFR -->
  <line x1="340" y1="250" x2="460" y2="250" stroke="#38bdf8" stroke-width="2"
        stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="400" y="242" text-anchor="middle" font-family="Inter, sans-serif"
        font-size="10" fill="#38bdf8">NOTIFY / AXFR+TSIG</text>

  <!-- Esclavo → Maestro: respuesta -->
  <line x1="460" y1="262" x2="340" y2="262" stroke="#6ee7b7" stroke-width="1.5"
        stroke-dasharray="4,4" marker-end="url(#arrowGreen)"/>

  <!-- Maestro → Cloudflare: túnel -->
  <line x1="200" y1="370" x2="200" y2="450" stroke="#c4b5fd" stroke-width="2"
        stroke-dasharray="5,3"/>
  <line x1="200" y1="450" x2="350" y2="490" stroke="#c4b5fd" stroke-width="2"
        stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="230" y="445" font-family="Inter, sans-serif" font-size="10" fill="#c4b5fd">
    Túnel cifrado
  </text>

  <!-- Leyenda -->
  <rect x="60" y="420" width="240" height="110" rx="10"
        fill="rgba(255,255,255,0.04)" stroke="#2d3748" stroke-width="1"/>
  <text x="80" y="442" font-family="Inter, sans-serif" font-size="12"
        font-weight="600" fill="#94a3b8">Leyenda</text>
  <line x1="80" y1="455" x2="115" y2="455" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="122" y="459" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">
    Transferencia zona (TSIG)
  </text>
  <line x1="80" y1="475" x2="115" y2="475" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="122" y="479" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">
    Túnel cloudflared
  </text>
  <rect x="80" y="488" width="12" height="12" fill="#0d6efd" rx="2"/>
  <text x="100" y="499" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">
    VM Maestro (Apache + DNS)
  </text>
  <rect x="80" y="508" width="12" height="12" fill="#198754" rx="2"/>
  <text x="100" y="519" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">
    VM Esclavo (DNS slave)
  </text>

  <!-- Red privada badge -->
  <rect x="290" y="400" width="220" height="28" rx="8"
        fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="419" text-anchor="middle" font-family="monospace"
        font-size="11" fill="#38bdf8">Red: 192.168.50.0/24 (Host-Only)</text>

</svg>
