# ──────────────────────────────────────────────────────────────────────────
# compression.conf — Configuración de compresión HTTP
# Parcial 1 · Servicios Telemáticos 2026-02
#
# NOTA: DeflateCompressionLevel y BrotliCompressionQuality son gestionados
#       dinámicamente por medir_compresion.sh (los modifica con sed,
#       recarga Apache y mide cada nivel). Este archivo define el valor
#       por defecto (nivel 6 para deflate, nivel 6 para brotli).
# ──────────────────────────────────────────────────────────────────────────

# ── mod_deflate (gzip) ────────────────────────────────────────────────────
<IfModule mod_deflate.c>

    # Nivel de compresión por defecto (medir_compresion.sh lo cambia: 1, 6, 9)
    DeflateCompressionLevel 6

    # Tipos de contenido a comprimir (texto y datos estructurados)
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE text/javascript
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE image/svg+xml

    # Excluir tipos ya comprimidos (binarios)
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|zip|gz|bz2|mp4|mp3|ogg|avi|webp)$ \
        no-gzip dont-vary

    # Cabecera Vary para informar a proxies y CDNs
    Header append Vary Accept-Encoding

</IfModule>

# ── mod_brotli ────────────────────────────────────────────────────────────
<IfModule mod_brotli.c>

    # Calidad de compresión por defecto (medir_compresion.sh cambia: 5, 11)
    BrotliCompressionQuality 6

    # Tipos de contenido a comprimir
    AddOutputFilterByType BROTLI_COMPRESS text/html
    AddOutputFilterByType BROTLI_COMPRESS text/plain
    AddOutputFilterByType BROTLI_COMPRESS text/xml
    AddOutputFilterByType BROTLI_COMPRESS text/css
    AddOutputFilterByType BROTLI_COMPRESS text/javascript
    AddOutputFilterByType BROTLI_COMPRESS application/javascript
    AddOutputFilterByType BROTLI_COMPRESS application/json
    AddOutputFilterByType BROTLI_COMPRESS application/xml
    AddOutputFilterByType BROTLI_COMPRESS image/svg+xml

    # Excluir tipos ya comprimidos
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|zip|gz|bz2|mp4|mp3|ogg|avi|webp)$ \
        no-brotli

</IfModule>
