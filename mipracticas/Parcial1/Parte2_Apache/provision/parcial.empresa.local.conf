# ──────────────────────────────────────────────────────────────────────────
# parcial.empresa.local.conf — VirtualHost Apache2
# Parcial 1 · Servicios Telemáticos 2026-02
# ServerName: parcial.empresa.local
# DocumentRoot: /var/www/parcial
# ──────────────────────────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  parcial.empresa.local
    ServerAlias www.empresa.local

    DocumentRoot /var/www/parcial

    <Directory /var/www/parcial>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ── Tipos MIME para recursos de prueba ────────────────────────────────
    AddType application/json        .json
    AddType image/svg+xml           .svg
    AddType text/javascript         .js

    # ── Logs propios del VirtualHost ──────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/parcial_error.log
    CustomLog ${APACHE_LOG_DIR}/parcial_access.log combined

    # ── Cabecera de depuración: muestra el nombre del servidor ───────────
    Header always set X-Servidor "parcial_master-192.168.50.10"
</VirtualHost>
