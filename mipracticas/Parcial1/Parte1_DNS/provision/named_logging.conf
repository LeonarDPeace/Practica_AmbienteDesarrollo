# ──────────────────────────────────────────────────────────────────────────
# named_logging.conf — Configuración de auditoría BIND9
# Parcial 1 · Servicios Telemáticos 2026-02
# Se incluye tanto en master_named.conf.local como en slave_named.conf.local
# ──────────────────────────────────────────────────────────────────────────
logging {

    # ── Canal: consultas DNS ──────────────────────────────────────────────
    channel queries_log {
        file "/var/log/named/queries.log" versions 5 size 10m;
        severity   dynamic;
        print-time yes;
        print-severity yes;
        print-category yes;
    };

    # ── Canal: transferencias de zona (AXFR / IXFR) ──────────────────────
    channel transfers_log {
        file "/var/log/named/transfers.log" versions 5 size 10m;
        severity   info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };

    # ── Canal: eventos de seguridad (TSIG, IXFR rechazadas, rate-limit) ──
    channel security_log {
        file "/var/log/named/security.log" versions 5 size 10m;
        severity   dynamic;
        print-time yes;
        print-severity yes;
        print-category yes;
    };

    # ── Asignación de categorías a canales ────────────────────────────────
    category queries    { queries_log;   };
    category xfer-in    { transfers_log; };
    category xfer-out   { transfers_log; };
    category notify     { transfers_log; };
    category security   { security_log;  };
    category rate-limit { security_log;  };
};
